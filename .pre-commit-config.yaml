# Baseline hooks. `uv run pre-commit run --files <changed files>` is the whole
# verification loop except execution and coverage, which stay manual because
# they need the narrowest practical entry point chosen per change.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-declarations
        name: every variable annotated before first binding
        entry: uv run python tools/check_declarations.py
        language: system
        types: [python]
      - id: pyright
        name: pyright (strict)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: true
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: true
        # One invocation over every file, never a partition per core. Two reasons, and the
        # second holds even without the first. pre-commit otherwise splits the file list
        # across concurrent processes that share one .mypy_cache, which crashed CI with
        # "INTERNAL ERROR" on a 4-core runner while every serial run passed on both Linux and
        # Windows. And mypy is a whole-program analyser: three green partitions of fifteen
        # files assert less than one green pass over sixty, because each partition sees only
        # its own slice as the program. upstream mirrors-mypy sets this for the same reasons.
        require_serial: true
