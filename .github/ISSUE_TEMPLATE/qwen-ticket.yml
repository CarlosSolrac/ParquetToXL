name: Implementation ticket
description: One unit of work, sized to a single stub and its frozen test.
title: "T-000 — "
labels: ["ticket"]
body:
  - type: markdown
    attributes:
      value: |
        One public function or class per ticket. If two assertion groups do not share
        setup, this is probably two tickets — split it. See `docs/tickets/SCHEMA.md`.

  - type: input
    id: phase
    attributes:
      label: Phase
      description: 0 Prereq · 1 Canonical+hashing · 2 Metadata · 3 Conversions · 4 Extract · 5 Excel · 6 Fixtures · 7 Integration
      placeholder: "3"
    validations:
      required: true

  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: Comma-separated ticket IDs that must land first. "none" if independent.
      placeholder: "T-011"
    validations:
      required: true

  - type: textarea
    id: do
    attributes:
      label: Do
      description: The single change. Name the exact symbol and file.
      placeholder: |
        Implement the body of `DataframeConversionToExcel._convert`'s boolean branch in
        src/parquet_to_xl/conversion/to_excel.py. Nothing else.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files
      description: One WRITE path. Every READ path with its line count.
      placeholder: |
        WRITE   src/parquet_to_xl/conversion/to_excel.py       (stub, 31 lines)
        READ    tests/unit/test_conversion_to_excel.py         (frozen, 74 lines)
        READ    src/parquet_to_xl/_style_example.py            (golden style, 64 lines)
      render: text
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Contract
      description: The docstring, verbatim. This is the spec — never a pointer to requirements-spec.md.
      render: text
    validations:
      required: true

  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions to verify first
      description: |
        Any library behaviour the frozen test will assert. Check each against a live
        interpreter before writing the assertion — every expensive mistake in this project
        so far has been an assumption frozen into a test before anyone ran it.
      placeholder: |
        polars reports Decimal as numeric and Boolean as not numeric  (measured)
        pydantic accepts a one-member discriminated union             (measured)
      render: text

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Exact commands. Narrow targets only — never --all-files, never --cov.
      value: |
        uv run pytest -x -q --no-header --tb=short tests/unit/<test file>
        uv run ruff check <write path>
        uv run pyright <write path>
        uv run mypy --strict <write path>
        uv run python tools/check_declarations.py <write path>
      render: text
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Orchestrator settings"

  - type: dropdown
    id: claude_effort
    attributes:
      label: Claude effort (to author this ticket)
      description: |
        The level needed to write the stub and the frozen test — not to implement against
        one that already exists, or to read a failure. `max` for anything whose frozen test
        is subtle or load-bearing. Checked against `get_session` where that tool is
        available; a mismatch halts and asks.
      options:
        - high
        - xhigh
        - max
      default: 1
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: Definition of ready
      options:
        - label: Stub committed with full signature, docstring, and `raise NotImplementedError`
          required: true
        - label: Frozen test committed and demonstrated red
          required: true
        - label: Frozen test demonstrated satisfiable — an implementation exists that passes it
          required: true
        - label: Contract above is pasted text, not a reference
          required: true
