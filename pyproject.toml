##
## Workspace root. Holds no code of its own: every runtime package lives under
## packages/, and this file carries the tooling configuration they share so there
## is one Ruff rule set, one pyright mode and one coverage gate for all of them.
##

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "numpy>=2.5.3",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",       # PyPI wrapper; downloads a Node runtime on first run
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<0.15",          # pinned: minor releases change which rules fire
    # Everything tests/ imports. Naming them means `uv sync` at the root is enough
    # for the integration suite; --all-packages is for building every member, not
    # for making the root tests importable.
    "pqx-calendar",
    "pqx-common",
    "pqx-excel",
    "pqx-frame",
    "pqx-plan",
    "pqx-report",
    "pqx-sidecar",
    "pqx-staging",
    "pqx-testing",               # fixtures and the shared pytest plugin
    "pqx-verify",
]

# The dev group above names members by bare name; without this uv would look for
# them on PyPI. Members that depend on each other declare the same in their own
# files, because a source is per-package rather than inherited from the root.
[tool.uv.sources]
pqx-calendar = { workspace = true }
pqx-common = { workspace = true }
pqx-excel = { workspace = true }
pqx-frame = { workspace = true }
pqx-plan = { workspace = true }
pqx-report = { workspace = true }
pqx-sidecar = { workspace = true }
pqx-staging = { workspace = true }
pqx-testing = { workspace = true }
pqx-verify = { workspace = true }

[tool.ruff]
target-version = "py313"
# Without this, notebooks are silently exempt from every rule below.
extend-include = ["*.ipynb"]
line-length = 220
indent-width = 4

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",   # pycodestyle subset + pyflakes
    "I",                      # import sorting
    "B",                      # bugbear
    "UP",                     # pyupgrade
    "SIM",                    # simplify
    "RUF",                    # ruff-specific
    "D",                      # pydocstyle
    "ANN",                    # missing annotations
    "PTH",                    # pathlib over os.path
    "S",                      # bandit security checks
    "RET",                    # return-statement hygiene
    "C4",                     # comprehension quality
    "LOG", "G",               # logging correctness and format style
    "TID",                    # tidy imports
    "N",                      # pep8-naming
    "A",                      # builtin shadowing
    "ARG",                    # unused arguments
    "DTZ",                    # timezone-aware datetimes
    "ERA",                    # commented-out code
    "T20",                    # stray print
    "SLF",                    # private member access
    "PGH",                    # blanket noqa / bare type-ignore
    "PT",                     # pytest style
    "ASYNC",                  # async correctness
    "INP",                    # implicit namespace packages
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# pytest's assert-based style trips bandit; test names carry the meaning that
# a mandatory docstring would only restate, so docstrings in tests are optional.
# The glob is anchored on any `tests/` directory, not the repository root one,
# because tests now sit beside the package they cover.
"**/tests/**/*.py" = ["S101", "S105", "S106", "D100", "D103", "INP001"]
# A file named test_*.py is a test file wherever it sits. Without these two
# patterns the ignores above never match a test written beside its module.
"test_*.py" = ["S101", "S105", "S106", "D100", "D103", "INP001"]
"**/test_*.py" = ["S101", "S105", "S106", "D100", "D103", "INP001"]
"conftest.py" = ["S101", "D100", "INP001"]
# AST and metaprogramming code cannot satisfy strict unknown-type reporting.
# A CLI tool prints by design; that is the intentional-output carve-out.
"tools/**/*.py" = ["INP001", "T201"]
# The phase 0 gate harnesses. Same carve-out for the same reason: each is run by
# hand and its table on stdout is the whole deliverable. They are outside
# coverage.source, so nothing here loosens the 100% gate.
"gates/**/*.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
# This already disables the conflicting D rules; do not add redundant D2xx ignores.
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = true
reportUnknownMemberType = true
# One stub directory for the whole workspace. Splitting it per package would mean
# maintaining the same fastexcel stub in three places.
stubPath = "stubs"

[[tool.pyright.executionEnvironments]]
# AST walking and other metaprogramming cannot satisfy strict unknown-type
# reporting without scattering ignores. Relax deliberately, in one place.
root = "tools"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.mypy]
python_version = "3.13"
mypy_path = "stubs"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
# Per-package tests plus the cross-package integration suite at the root.
testpaths = ["packages", "tests"]

[tool.coverage.run]
branch = true
# The runtime packages only. pqx-testing is dev-only test support, so measuring it
# would measure the fixtures rather than the libraries -- which is also why the
# _style_example omit that used to live here is gone: the file moved into
# pqx-testing and is therefore already outside this list.
source = [
    "packages/pqx-calendar/src/pqx_calendar",
    "packages/pqx-common/src/pqx_common",
    "packages/pqx-frame/src/pqx_frame",
    "packages/pqx-excel/src/pqx_excel",
    "packages/pqx-plan/src/pqx_plan",
    "packages/pqx-report/src/pqx_report",
    "packages/pqx-sidecar/src/pqx_sidecar",
    "packages/pqx-staging/src/pqx_staging",
    "packages/pqx-verify/src/pqx_verify",
]

[tool.coverage.report]
# No fail_under: the gate is merge-only, applied as --cov-fail-under in CI. A
# global threshold fails every phase-level run while a package is still mostly
# unimplemented stubs, for reasons unrelated to the change under test.
show_missing = true
