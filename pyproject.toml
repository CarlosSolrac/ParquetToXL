##
## Baseline tooling configuration for a new Python project.
## Use the repository's existing configuration when one is already present.
##

[project]
name = "ParquetToXL"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "adlfs>=2026.4",            # Azure fsspec backend. 2026.4 is where `anon` began defaulting to false; before it,
                                # an account_name-only path takes anonymous access instead of DefaultAzureCredential.
    "duckdb>=1.5.5",
    "fastexcel[pyarrow]>=0.21.0",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "python-calamine>=0.8.2",
    "rustpy-xlsxwriter>=0.6.1",
    "structlog>=26.1.0",
    "tzdata>=2026.3",
    "universal-pathlib>=0.3.10",
    "xlsxwriter>=3.2.9",
    "xxhash>=4.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "numpy>=2.5.3",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",       # PyPI wrapper; downloads a Node runtime on first run
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<0.15",          # pinned: minor releases change which rules fire
]

# Declared so uv installs the package itself, editable, into the project
# environment. Without it uv treats this as a virtual project and `import
# parquet_to_xl` only resolves by accident of sys.path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution name normalizes to `parquettoxl`, which hatchling would not
# find on its own under src layout; name the import package explicitly.
packages = ["src/parquet_to_xl"]

[tool.ruff]
target-version = "py313"
# Without this, notebooks are silently exempt from every rule below.
extend-include = ["*.ipynb"]
line-length = 220
indent-width = 4

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",   # pycodestyle subset + pyflakes
    "I",                      # import sorting
    "B",                      # bugbear
    "UP",                     # pyupgrade
    "SIM",                    # simplify
    "RUF",                    # ruff-specific
    "D",                      # pydocstyle
    "ANN",                    # missing annotations
    "PTH",                    # pathlib over os.path
    "S",                      # bandit security checks
    "RET",                    # return-statement hygiene
    "C4",                     # comprehension quality
    "LOG", "G",               # logging correctness and format style
    "TID",                    # tidy imports
    "N",                      # pep8-naming
    "A",                      # builtin shadowing
    "ARG",                    # unused arguments
    "DTZ",                    # timezone-aware datetimes
    "ERA",                    # commented-out code
    "T20",                    # stray print
    "SLF",                    # private member access
    "PGH",                    # blanket noqa / bare type-ignore
    "PT",                     # pytest style
    "ASYNC",                  # async correctness
    "INP",                    # implicit namespace packages
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# pytest's assert-based style and test-only fixtures trip the bandit rules.
# pytest's assert-based style trips bandit; test names carry the meaning that
# a mandatory docstring would only restate, so docstrings in tests are optional.
"tests/**/*.py" = ["S101", "S105", "S106", "D100", "D103", "INP001"]
# A file named test_*.py is a test file wherever it sits. Without these two
# patterns the ignores above never match a test written beside its module.
"test_*.py" = ["S101", "S105", "S106", "D100", "D103", "INP001"]
"**/test_*.py" = ["S101", "S105", "S106", "D100", "D103", "INP001"]
"conftest.py" = ["S101", "D100", "INP001"]
# AST and metaprogramming code cannot satisfy strict unknown-type reporting.
# A CLI tool prints by design; that is the intentional-output carve-out.
"tools/**/*.py" = ["INP001", "T201"]

[tool.ruff.lint.pydocstyle]
# This already disables the conflicting D rules; do not add redundant D2xx ignores.
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = true
reportUnknownMemberType = true
stubPath = "stubs"

[[tool.pyright.executionEnvironments]]
# AST walking and other metaprogramming cannot satisfy strict unknown-type
# reporting without scattering ignores. Relax deliberately, in one place.
root = "tools"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.mypy]
python_version = "3.13"
mypy_path = "stubs"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# Without this the figure covers whatever happened to be imported, tests and
# tools included. Scope it to the library so the number means the library.
source = ["src/parquet_to_xl"]

[tool.coverage.report]
# No fail_under: the gate is merge-only, applied as --cov-fail-under in CI. A
# global threshold fails every phase-level run while the package is still
# mostly unimplemented stubs, for reasons unrelated to the change under test.
# _style_example.py is a style reference that nothing imports and nothing calls.
# It is not library behaviour, so measuring it measures the wrong thing -- and it
# alone dragged the gate from 100% to 85%.
omit = ["*/_style_example.py"]
show_missing = true
