[project]
name = "pqx-frame"
version = "0.1.0"
description = "Canonical encoding, order-independent hashing, column metadata and conversions."
requires-python = ">=3.13"
dependencies = [
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "structlog>=26.1.0",
    "tzdata>=2026.3",          # Windows ships no tz database; without it every IANA lookup fails.
    "universal-pathlib>=0.3.10",
    "xxhash>=4.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pqx-common",
    "pqx-testing",
]

[tool.uv.sources]
pqx-common = { workspace = true }
pqx-testing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_frame"]
