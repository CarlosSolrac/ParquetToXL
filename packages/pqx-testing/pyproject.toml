[project]
name = "pqx-testing"
version = "0.1.0"
description = "Deterministic fixtures and the shared pytest plugin. Dev-only."
requires-python = ">=3.13"
dependencies = [
    "polars>=1.44.1",
    "pytest>=8,<9",           # the pytest11 plugin below imports both at module level,
    "structlog>=26.1.0",      # and loads before collection, so neither can be dev-only.
    "rustpy-xlsxwriter>=0.6.1",
    "xlsxwriter>=3.2.9",
]

[project.entry-points.pytest11]
pqx_testing = "pqx_testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_testing"]
