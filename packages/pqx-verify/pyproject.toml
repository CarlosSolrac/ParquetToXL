[project]
name = "pqx-verify"
version = "0.1.0"
description = "Checking a written workbook against the sidecar recorded before it existed."
requires-python = ">=3.13"
dependencies = [
    "fastexcel[pyarrow]>=0.21.0",
    "polars>=1.44.1",
    "pqx-excel",
    "pqx-frame",
    "pqx-sidecar",
    "universal-pathlib>=0.3.10",
]

[tool.uv.sources]
pqx-common = { workspace = true }
pqx-testing = { workspace = true }
pqx-excel = { workspace = true }
pqx-frame = { workspace = true }
pqx-sidecar = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pqx-common",
    "pqx-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_verify"]
