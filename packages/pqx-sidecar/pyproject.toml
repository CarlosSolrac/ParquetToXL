[project]
name = "pqx-sidecar"
version = "0.1.0"
description = "Persistence of a metadata record as a JSON file beside the file it describes."
requires-python = ">=3.13"
dependencies = [
    "pqx-frame",
    "pydantic>=2.13.5",
    "universal-pathlib>=0.3.10",
]

[tool.uv.sources]
pqx-common = { workspace = true }
pqx-testing = { workspace = true }
pqx-frame = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pqx-common",
    "pqx-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_sidecar"]
