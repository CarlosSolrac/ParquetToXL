[project]
name = "pqx-report"
version = "0.1.0"
description = "What a run did, as a model and as three renderings of it."
requires-python = ">=3.13"
# Presentation only, and deliberately thin. No template engine: the renderers are stdlib string
# building, because a dependency here would be inherited by everything that reports.
dependencies = [
    "pqx-plan",
    "pqx-verify",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv.sources]
pqx-plan = { workspace = true }
pqx-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_report"]
