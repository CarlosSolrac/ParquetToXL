[project]
name = "pqx-plan"
version = "0.1.0"
description = "Planning models: the run manifest a write produces and the receipt a run leaves behind."
requires-python = ">=3.13"
dependencies = [
    "pqx-frame",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv.sources]
pqx-frame = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_plan"]
