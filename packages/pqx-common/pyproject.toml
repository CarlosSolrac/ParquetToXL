[project]
name = "pqx-common"
version = "0.1.0"
description = "Path construction and logging configuration shared by every package."
requires-python = ">=3.13"
dependencies = [
    "adlfs>=2026.4",            # Azure fsspec backend, reached through UPath rather than imported.
    "structlog>=26.1.0",
    "universal-pathlib>=0.3.10",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pqx-testing",
]

[tool.uv.sources]
pqx-testing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_common"]
