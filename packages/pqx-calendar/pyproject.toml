[project]
name = "pqx-calendar"
version = "0.1.0"
description = "Date-column interpretation, period keys, period labels and calendar grids."
requires-python = ">=3.13"
# Only pydantic and the timezone database. The dependency diagram puts this package
# between pqx-common and pqx-plan, and "pure" is the whole reason it is separable:
# no Polars, no I/O, no frame types. tzdata is here for the same reason pqx-frame
# declares it -- zoneinfo has no database of its own on Windows, and the `zone`
# calendar mode is unusable without one.
dependencies = [
    "pydantic>=2.13.5",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqx_calendar"]
